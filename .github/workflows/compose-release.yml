name: Compose release gate

on:
  push:
    branches: [main, "arena/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: compose-release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  static:
    name: Static validation
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Clean dependency install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Production build
        run: npm run build

  compose-release:
    name: Real Compose release gate
    needs: static
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      # Keep failed containers long enough to collect web, worker, and
      # Playwright diagnostics. The final cleanup step always removes them.
      WAVEYARD_KEEP_COMPOSE: "1"
      WAVEYARD_KEEP_E2E_CONTAINER: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Verify Docker Compose
        run: |
          docker version
          docker compose version

      - name: Clean dependency install
        run: npm ci

      - name: Run real Compose release gate
        run: npm run test:compose

      - name: Collect Compose diagnostics
        if: always()
        shell: bash
        run: |
          set +e
          mkdir -p ci-artifacts
          docker compose ps -a > ci-artifacts/compose-ps.txt 2>&1
          docker compose logs --no-color --timestamps > ci-artifacts/compose.log 2>&1
          docker logs waveyard-e2e-release-gate > ci-artifacts/e2e-container.log 2>&1
          docker cp waveyard-e2e-release-gate:/app/playwright-report ci-artifacts/playwright-report 2>&1
          docker cp waveyard-e2e-release-gate:/app/test-results ci-artifacts/test-results 2>&1
          exit 0

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: compose-release-diagnostics
          path: ci-artifacts
          if-no-files-found: warn
          retention-days: 14

      - name: Remove Compose services and volumes
        if: always()
        shell: bash
        run: |
          docker rm -f waveyard-e2e-release-gate 2>/dev/null || true
          docker compose down --volumes --remove-orphans
