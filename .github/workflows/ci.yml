# CI — static quality gate + real Compose build smoke.
#
# Provenance: adapted from arena/01a0bebf-arena-os-canonical's
# compose-release workflow (that branch's monorepo topology — apps/web,
# apps/worker, packages/* — was not adopted; see
# docs/branch-integration/ for the full ledger). The static gate is the
# branch's as-is; the release gate is reduced to what this tree's
# docker-compose.yml actually defines (postgres, redis, setup, web,
# worker — no test profile / e2e image here), so every job in this file
# is green-by-construction against this repository, not aspirational.
#
# The branch's full release gate (docker compose --profile test, the
# waveyard-e2e-release-gate container, scripts/test-compose.ts) remains
# in branch history for when the e2e compose profile is built here.

name: CI

on:
  push:
    branches: [main, "arena/**"]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: Typecheck, lint, test, build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # The suite's PG-gated tests (archive routes, email accounts, the local
    # media library, missions) assert against a REAL PostgreSQL — they fail
    # loudly rather than skip when it is missing. CI provides one, exactly
    # like a dev machine running `npm run db:setup`.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d app_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/app_db
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Clean dependency install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Prepare test database
        run: npm run db:setup

      # The suite's PG-gated files share one database and several of them wipe
      # shared tables in their cleanup, so two files running at once can
      # corrupt each other's fixtures (observed: the local-library file's rows
      # vanishing mid-run). Files run one at a time here so the shared-database
      # contract is deterministic; the run is otherwise identical to `npm test`.
      - name: Test
        run: |
          set -o pipefail
          npm test -- --test-concurrency=1 2>&1 | tee /tmp/waveyard-test-tap.log

      # The TAP output is the only place a failing test names itself: the
      # artifact keeps it downloadable, and the annotations put the failing
      # test and its detail directly on the pull request.
      - name: Surface test failures
        if: failure()
        run: node scripts/ci-annotate-test-failures.mjs /tmp/waveyard-test-tap.log

      - name: Upload test output (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-tap-output
          path: /tmp/waveyard-test-tap.log
          if-no-files-found: ignore

      - name: Build
        run: npm run build

  compose-build:
    name: Compose images build
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4

      - name: Verify Docker Compose
        run: |
          docker version
          docker compose version

      - name: Build web and worker images
        run: docker compose build web worker

      - name: Compose config validates
        run: docker compose config --quiet
