name: Waveyard recovery-safe ownership benchmark

on:
  push:
    branches:
      - benchmark/waveyard-encoded-recovery
      - benchmark/waveyard-peak-recovery

permissions:
  contents: read

concurrency:
  group: waveyard-ownership-benchmark-${{ github.ref }}
  cancel-in-progress: false

jobs:
  baseline-first-comparison:
    name: Baseline first · 4/16/32 sources · 3 repeats
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      BASELINE_SHA: a8e015592e81fcd0916e5a0f97baf3f8721ec091
      CHROMIUM_VERSION: 153.0.8010.0
      ARENA_MEMORY_COUNTS: "4,16,32"
      ARENA_MEMORY_REPEATS: "3"
      ARENA_FFMPEG_PATH: /usr/bin/ffmpeg
      ARENA_FFPROBE_PATH: /usr/bin/ffprobe
      EVIDENCE_DIR: .data/waveyard-ownership-benchmark

    steps:
      - name: Check out candidate snapshot
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install exact Node.js runtime
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.3

      - name: Install browser and media system packages
        run: |
          sudo apt-get update
          sudo apt-get install --yes curl ffmpeg unzip

      - name: Install locked project dependencies
        run: npm ci --no-audit --no-fund

      - name: Prepare embedded PostgreSQL runtime libraries
        run: |
          set -euo pipefail
          pg_native="$GITHUB_WORKSPACE/node_modules/@embedded-postgres/linux-x64/native"
          pg_lib="$pg_native/lib"
          for soname in libpq.so.5 libicui18n.so.60 libicuuc.so.60 libicudata.so.60; do
            library="$(find "$pg_lib" -maxdepth 1 -type f -name "${soname}.*" -printf '%f\n' | sort -V | tail -n 1)"
            if [[ -z "$library" ]]; then
              echo "Embedded PostgreSQL runtime library missing: $soname"
              exit 1
            fi
            ln -sfn "$library" "$pg_lib/$soname"
          done
          export LD_LIBRARY_PATH="$pg_lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          for binary in initdb postgres pg_ctl; do
            missing="$(ldd "$pg_native/bin/$binary" | awk '/not found/ {print}')"
            if [[ -n "$missing" ]]; then
              printf '%s has unresolved native libraries:\n%s\n' "$binary" "$missing"
              exit 1
            fi
          done
          echo "LD_LIBRARY_PATH=$LD_LIBRARY_PATH" >> "$GITHUB_ENV"

      - name: Install Chromium native dependencies
        run: npx playwright install-deps chromium

      - name: Install exact Chrome for Testing build
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/chrome-for-testing-${CHROMIUM_VERSION}.zip"
          browser_dir="$RUNNER_TEMP/chrome-for-testing"
          curl --fail --location --silent --show-error --retry 3 \
            "https://storage.googleapis.com/chrome-for-testing-public/${CHROMIUM_VERSION}/linux64/chrome-linux64.zip" \
            --output "$archive"
          mkdir -p "$browser_dir"
          unzip -q "$archive" -d "$browser_dir"
          chrome="$browser_dir/chrome-linux64/chrome"
          chmod +x "$chrome"
          actual_version="$("$chrome" --version | awk '{print $NF}')"
          test "$actual_version" = "$CHROMIUM_VERSION"
          missing_libraries="$(ldd "$chrome" | awk '/not found/ {print}')"
          if [[ -n "$missing_libraries" ]]; then
            printf 'Chrome has unresolved native libraries:\n%s\n' "$missing_libraries"
            exit 1
          fi
          echo "CHROMIUM_EXECUTABLE_PATH=$chrome" >> "$GITHUB_ENV"

      - name: Record runner, runtime, and source identities
        run: |
          set -euo pipefail
          mkdir -p "$EVIDENCE_DIR"
          candidate_sha="$(git rev-parse HEAD)"
          test "$(node --version)" = "v22.22.3"
          memory_kib="$(awk '/^MemTotal:/ {print $2}' /proc/meminfo)"
          if (( memory_kib < 8 * 1024 * 1024 )); then
            echo "Runner exposes less than 8 GiB RAM; refusing an under-sized comparison."
            exit 1
          fi
          git cat-file -e "${BASELINE_SHA}^{commit}"
          git diff --exit-code "$BASELINE_SHA" "$candidate_sha" -- package.json package-lock.json
          {
            echo "baseline_sha=$BASELINE_SHA"
            echo "candidate_sha=$candidate_sha"
            echo "candidate_branch=$GITHUB_REF_NAME"
            echo "workflow_run=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo "node=$(node --version)"
            echo "npm=$(npm --version)"
            echo "chrome=$("$CHROMIUM_EXECUTABLE_PATH" --version)"
            echo "ffmpeg=$(/usr/bin/ffmpeg -version | sed -n '1p')"
            echo "ffprobe=$(/usr/bin/ffprobe -version | sed -n '1p')"
            echo "embedded_postgres=$("$GITHUB_WORKSPACE/node_modules/@embedded-postgres/linux-x64/native/bin/postgres" --version)"
            echo "MemTotal_kB=$memory_kib"
            echo "runner_name=${RUNNER_NAME:-unknown}"
            echo "runner_os=${RUNNER_OS:-unknown}"
            echo "--- /etc/os-release ---"
            cat /etc/os-release
            echo "--- uname ---"
            uname -a
            echo "--- CPU ---"
            lscpu
            echo "--- cgroup memory limit ---"
            if [[ -r /sys/fs/cgroup/memory.max ]]; then cat /sys/fs/cgroup/memory.max; else echo unavailable; fi
          } > "$EVIDENCE_DIR/runtime-and-source.txt"
          sha256sum src/lib/waveyard/arrangement-preparation.ts \
            tests/acceptance/studio-fx.test.mjs \
            tests/acceptance/studio-preparation.fixture.ts \
            scripts/compare-waveyard-ownership-benchmark.mjs \
            .github/workflows/waveyard-ownership-benchmark.yml \
            > "$EVIDENCE_DIR/candidate-file-hashes.txt"
          printf '%s\n' \
            "Baseline: $BASELINE_SHA" \
            "Candidate: $candidate_sha" \
            "Node.js: 22.22.3" \
            "Chrome for Testing: $CHROMIUM_VERSION" \
            "Workloads: 4, 16, and 32 sources; 3 sequential repeats per workload and implementation" \
            "Order: baseline first, then encoded-recovery candidate, in this same runner job" \
            "Correctness gate: exact cold and edited stereo PCM SHA-256 equality for all nine matched pairs" \
            "PSS scope: browser process tree sampled every 50 ms; peak and retained values are distinct measurements" \
            > "$EVIDENCE_DIR/manifest.txt"

      - name: Typecheck the candidate snapshot
        run: npm run typecheck 2>&1 | tee "$EVIDENCE_DIR/typecheck.log"

      - name: Prepare exact baseline with the same harness and dependencies
        run: |
          set -euo pipefail
          candidate_sha="$(git rev-parse HEAD)"
          baseline_dir="$RUNNER_TEMP/waveyard-owner-baseline"
          git worktree add --detach "$baseline_dir" "$BASELINE_SHA"
          git show "$candidate_sha:tests/acceptance/studio-fx.test.mjs" \
            > "$baseline_dir/tests/acceptance/studio-fx.test.mjs"
          git show "$candidate_sha:tests/acceptance/studio-preparation.fixture.ts" \
            > "$baseline_dir/tests/acceptance/studio-preparation.fixture.ts"
          ln -s "$GITHUB_WORKSPACE/node_modules" "$baseline_dir/node_modules"
          test "$(git -C "$baseline_dir" rev-parse HEAD)" = "$BASELINE_SHA"
          {
            echo "baseline_head=$(git -C "$baseline_dir" rev-parse HEAD)"
            echo "baseline_arrangement_source_sha256=$(sha256sum "$baseline_dir/src/lib/waveyard/arrangement-preparation.ts" | awk '{print $1}')"
            echo "harness_source_sha256=$(sha256sum "$baseline_dir/tests/acceptance/studio-fx.test.mjs" | awk '{print $1}')"
            echo "fixture_source_sha256=$(sha256sum "$baseline_dir/tests/acceptance/studio-preparation.fixture.ts" | awk '{print $1}')"
          } > "$EVIDENCE_DIR/baseline-file-hashes.txt"

      - name: Run baseline correctness gates and 4/16/32-source measurements
        run: |
          set -euo pipefail
          baseline_dir="$RUNNER_TEMP/waveyard-owner-baseline"
          pattern='per-asset source revision|real Chromium structured-clone failure|warm preparation cancellation|distinct-source preparation profiles 4/16/32'
          {
            echo "baseline-start=$(date -u +%FT%TZ)"
            for file in /sys/fs/cgroup/memory.current /sys/fs/cgroup/memory.max /sys/fs/cgroup/memory.events; do
              if [[ -r "$file" ]]; then echo "--- $file ---"; cat "$file"; fi
            done
          } >> "$EVIDENCE_DIR/runner-memory.txt"
          set +e
          (
            cd "$baseline_dir"
            ARENA_MEMORY_CANDIDATE=baseline \
              node --import ./scripts/register-src-loader.mjs --test \
              --test-name-pattern "$pattern" \
              tests/acceptance/studio-fx.test.mjs
          ) 2>&1 | tee "$EVIDENCE_DIR/baseline.tap"
          test_status=${PIPESTATUS[0]}
          set -e
          {
            echo "baseline-end=$(date -u +%FT%TZ)"
            for file in /sys/fs/cgroup/memory.current /sys/fs/cgroup/memory.max /sys/fs/cgroup/memory.events; do
              if [[ -r "$file" ]]; then echo "--- $file ---"; cat "$file"; fi
            done
          } >> "$EVIDENCE_DIR/runner-memory.txt"
          exit "$test_status"

      - name: Run candidate correctness gates and 4/16/32-source measurements
        run: |
          set -euo pipefail
          pattern='per-asset source revision|real Chromium structured-clone failure|warm preparation cancellation|distinct-source preparation profiles 4/16/32'
          {
            echo "candidate-start=$(date -u +%FT%TZ)"
            for file in /sys/fs/cgroup/memory.current /sys/fs/cgroup/memory.max /sys/fs/cgroup/memory.events; do
              if [[ -r "$file" ]]; then echo "--- $file ---"; cat "$file"; fi
            done
          } >> "$EVIDENCE_DIR/runner-memory.txt"
          set +e
          ARENA_MEMORY_CANDIDATE=encoded-recovery \
            node --import ./scripts/register-src-loader.mjs --test \
            --test-name-pattern "$pattern" \
            tests/acceptance/studio-fx.test.mjs \
            2>&1 | tee "$EVIDENCE_DIR/candidate.tap"
          test_status=${PIPESTATUS[0]}
          set -e
          {
            echo "candidate-end=$(date -u +%FT%TZ)"
            for file in /sys/fs/cgroup/memory.current /sys/fs/cgroup/memory.max /sys/fs/cgroup/memory.events; do
              if [[ -r "$file" ]]; then echo "--- $file ---"; cat "$file"; fi
            done
          } >> "$EVIDENCE_DIR/runner-memory.txt"
          exit "$test_status"

      - name: Validate candidate-only recovery and fallback correctness
        run: |
          set -euo pipefail
          pattern='real preparation cancellation|large encoded recovery sources'
          ARENA_MEMORY_CANDIDATE=encoded-recovery \
            node --import ./scripts/register-src-loader.mjs --test \
            --test-name-pattern "$pattern" \
            tests/acceptance/studio-fx.test.mjs \
            2>&1 | tee "$EVIDENCE_DIR/candidate-recovery-gates.tap"

      - name: Compare all matched PCM hashes and summarize measurements
        run: |
          set -euo pipefail
          BENCHMARK_BASELINE_SHA="$BASELINE_SHA" \
          BENCHMARK_CANDIDATE_SHA="$(git rev-parse HEAD)" \
          CHROMIUM_VERSION="$CHROMIUM_VERSION" \
          node scripts/compare-waveyard-ownership-benchmark.mjs \
            "$EVIDENCE_DIR/baseline.tap" \
            "$EVIDENCE_DIR/candidate.tap" \
            "$EVIDENCE_DIR/comparison.json" \
            2>&1 | tee "$EVIDENCE_DIR/comparison.log"

      - name: Upload raw logs and structured benchmark evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: waveyard-ownership-benchmark-${{ github.run_id }}-${{ github.run_attempt }}
          path: .data/waveyard-ownership-benchmark/
          if-no-files-found: warn
          retention-days: 90
