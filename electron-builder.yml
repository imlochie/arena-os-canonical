# Arena Windows desktop packaging (electron-builder).
#
# Producing the NSIS artifact requires a networked Windows (or cross-build)
# machine: electron + electron-builder download Electron binaries from
# github.com, which this sandbox cannot reach. The configuration is complete
# and committed; run `npm run desktop:dist` on a machine with access.
#
# What ships (spec §15: no repo junk, caches, secrets, or fixtures):
#   - Electron + compiled desktop shell + splash
#   - Next standalone server (server.js + minimal node_modules)
#   - .next/static + public/
#   - desktop-migrations/ (canonical schema)
#   - FFmpeg + FFprobe binaries (@ffmpeg-installer builds, GPL — see
#     build/licenses/FFMPEG-LICENSE.txt)
#   - Embedded PostgreSQL windows-x64 binaries

appId: ai.arena.os
productName: Arena
copyright: Copyright © Arena

directories:
  output: desktop-release
  buildResources: desktop/build

# Package the LOCAL Electron distribution instead of downloading one from
# github.com (electron 44 has no npm install script; the binary is hydrated
# lazily into node_modules/electron/dist by electron itself). The wrapper
# scripts/desktop-dist.mjs validates existence + version before building —
# no silent mismatches, no disabled integrity checks.
electronDist: node_modules/electron/dist

files:
  - desktop/dist/**
  - desktop/splash/**
  - desktop/build/icon.png
  - package.json
  - "!**/*.test.*"
  - "!**/__tests__/**"

extraResources:
  # Next standalone server (built by desktop:prepare-server)
  - from: desktop-package/server
    to: app/server
  # Static assets Next expects beside the server (staged inside server/)
  # (kept for clarity; desktop-prepare-server stages .next/static + public
  #  INSIDE the server tree, matching the standalone layout)
  # Canonical SQL migrations
  - from: desktop-package/desktop-migrations
    to: app/desktop-migrations
  # FFmpeg/FFprobe (GPL builds — license file included)
  - from: desktop-package/bin
    to: app/bin
  - from: desktop/build/licenses
    to: licenses
  # Embedded PostgreSQL binaries (platform npm package, extracted at packaging)
  - from: desktop-package/embedded-postgres
    to: app/embedded-postgres

asar: true
asarUnpack:
  - "**/*.exe"

# The Electron app package (asar) contains ONLY the compiled desktop shell,
# which imports zero native modules (node builtins + zod + local code). The
# heavy runtime — Next server, pg, bullmq — ships as extraResources and runs
# in a SEPARATE process via ELECTRON_RUN_AS_NODE, not inside Electron, so
# rebuilding native modules for Electron's ABI is both unnecessary and (on a
# Linux/macOS host) impossible: node-gyp cannot cross-compile. The native
# modules that do run (sharp, msgpackr-extract) are N-API prebuilds, which
# are ABI-stable across Node and Electron runtimes.
npmRebuild: false

win:
  target:
    - target: nsis
      arch:
        - x64
  icon: desktop/build/icon.png

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Arena
  # No auto-updater claims (spec §14): version infrastructure only.
  deleteAppDataOnUninstall: false
