openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: waveyard
    description: Waveyard library operations
paths:
  /library/sessions/{id}/tracks:
    patch:
      operationId: reorderListeningSession
      tags: [waveyard]
      summary: Move a session entry, optionally within playlist-only slots
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ListeningSessionOrderInput" }
      responses:
        "200":
          description: Updated session envelope
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        "409":
          description: Stale expected order; error and current session are returned for an explicit retry
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
  /library/queue/{id}:
    patch:
      operationId: reorderSavedQueue
      tags: [waveyard]
      summary: Move a saved queue entry and synchronize linked slots in the selected session
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SavedQueueOrderInput" }
      responses:
        "200":
          description: Updated queue and affected session identifiers
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        "409":
          description: Stale expected order; error and current queue are returned for an explicit retry
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
  /arcade/development:
    post:
      operationId: runArcadeDevelopment
      tags: [arcade]
      summary: Explicit owner-authorized local-model development with private source
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ArcadeDevelopmentInput" }
      responses:
        "200":
          description: Request-scoped snapshot and source-redacted mission journal
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "503":
          description: No supported selected model
  /arcade/mods/repository/review:
    post:
      operationId: reviewArcadeModRepository
      summary: Read a licensed pinned mod package without executing repository code
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ArcadeModRepositoryInput" }
      responses:
        "200":
          description: Package bytes and verified provenance for separate local review
          content:
            application/json:
              schema:
                type: object
                required: [packageJson]
                properties:
                  packageJson: { type: string }
  /arcade/import/catalog/search:
    post:
      operationId: searchArcadeCatalog
      summary: Search both public catalogs without downloading or claiming a playable game
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ArcadeCatalogSearchInput"
      responses:
        "200":
          description: Bounded discovery results, with source availability
          content:
            application/json:
              schema:
                type: object
                required: [entries, total, offset, hasMore, sources]
                properties:
                  entries: { type: array, items: { $ref: "#/components/schemas/ArcadeCatalogEntry" } }
                  total: { type: integer }
                  offset: { type: integer }
                  hasMore: { type: boolean }
                  sources:
                    type: array
                    items:
                      type: object
                      required: [catalog, available, error, fetchedAt]
                      properties:
                        catalog: { type: string }
                        available: { type: boolean }
                        error: { type: [string, "null"] }
                        fetchedAt: { type: [number, "null"] }
        default:
          description: Catalog unavailable or input invalid
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ArcadeRepositoryError" }
  /arcade/import/catalog/resolve:
    post:
      operationId: resolveArcadeCatalogGame
      summary: Resolve the catalog's actual source repository; no arbitrary URLs or execution
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ArcadeCatalogResolveInput"
      responses:
        "200":
          description: Unverified catalog metadata and resolved source URL for separate repository review
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ArcadeCatalogEntry" }
        default:
          description: Entry unavailable
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ArcadeRepositoryError" }
  /arcade/import/repository/release:
    post:
      operationId: resolveArcadeRepositoryRelease
      summary: Resolve a reviewed immutable release to a publisher-digested Windows x64 portable ZIP
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ArcadeRepositoryReleaseInput"
      responses:
        "200":
          description: Download pin only; owner desktop approval is still required before installation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArcadeRepositoryReleasePlan"
        default:
          description: Release needs a new review, digest or supported portable layout
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArcadeRepositoryError"
  /arcade/import/repository/assess:
    post:
      operationId: assessArcadeRepository
      summary: Review pinned source, licenses, dependencies and release candidates without installing
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ArcadeRepositoryLinkInput"
      responses:
        "200":
          description: Owner-bound five-minute review; static evidence is not build or gameplay proof
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArcadeRepositoryAssessment"
        default:
          description: Unsupported provider or unavailable repository
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArcadeRepositoryError"
  /arcade/import/repository/source:
    post:
      operationId: acquireArcadeRepositorySource
      summary: Acquire verified native project source without executing it on the API host
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ArcadeRepositoryAcquisitionInput"
      responses:
        "200":
          description: Bounded verified source bytes for a separate approved desktop build
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArcadeRepositorySourceSnapshot"
        default:
          description: Review expired, blocked, unavailable or belongs to another owner
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArcadeRepositoryError"
  /arcade/import/repository/inspect:
    post:
      operationId: inspectArcadeRepository
      summary: Preview a public GitHub offline game at a pinned commit
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ArcadeRepositoryLinkInput"
      responses:
        "200":
          description: License and bounded file manifest; no game has been imported yet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArcadeRepositoryPreview"
        default:
          description: Repository refused or unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArcadeRepositoryError"
  /arcade/import/repository/acquire:
    post:
      operationId: acquireArcadeRepository
      summary: Download and verify the source files from an approved preview
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ArcadeRepositoryAcquisitionInput"
      responses:
        "200":
          description: Exact pinned files for the existing local sandbox importer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArcadeRepositorySnapshot"
        default:
          description: Expired preview, unsafe package, or acquisition failure
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArcadeRepositoryError"
  /library/tracks:
    get:
      operationId: getLibraryTracks
      tags: [waveyard]
      summary: List library tracks with available stem types
      parameters:
        - name: q
          in: query
          required: false
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 500
      responses:
        "200":
          description: Library tracks
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LibraryTrackListResponse"
  /library/conversions:
    get:
      operationId: getLibraryConversionOptions
      tags: [waveyard]
      summary: List formats supported for local audio conversion
      responses:
        "200":
          description: Local conversion options and source restrictions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LibraryConversionOptionsResponse"
    post:
      operationId: createLibraryConversion
      tags: [waveyard]
      summary: Convert an owner-uploaded local audio track
      description: Converts only a device-uploaded local file after an explicit rights review. Protected subscription audio is not accessed.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LibraryConversionInput"
      responses:
        "200":
          description: Existing matching conversion job returned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LibraryConversionJob"
        "202":
          description: Conversion job accepted or already in progress
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LibraryConversionJob"
        "403":
          description: Source is not a device-uploaded local audio file
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Track not found for the current owner
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /library/conversions/jobs:
    get:
      operationId: listLibraryConversionJobs
      tags: [waveyard]
      summary: List durable local audio conversion jobs
      responses:
        "200":
          description: Conversion jobs owned by the current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LibraryConversionJobsResponse"
  /library/conversions/jobs/{id}:
    get:
      operationId: getLibraryConversionJob
      tags: [waveyard]
      summary: Get a durable local audio conversion job
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Conversion job owned by the current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LibraryConversionJob"
        "404":
          description: Job not found for the current owner
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: Source checksum did not match its stored identity
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /library/audio-capture:
    get:
      operationId: getLibraryAudioCaptureOptions
      parameters:
        - name: mediaMetadata
          in: query
          schema:
            type: string
            enum: ["1"]
      tags: [waveyard]
      summary: Check Windows audio capture modes and availability
      responses:
        "200":
          description: Capture-host status, active playback endpoints, and eligible applications when process loopback is supported
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LibraryAudioCaptureOptionsResponse"
    post:
      operationId: startLibraryAudioCapture
      tags: [waveyard]
      summary: Start an authorized Windows audio recording
      description: |
        When processId and processStartTime are both supplied, captures that application's process tree, excluding other applications. This mode requires Windows build 20348 or later and never falls back to system audio.
        Otherwise, captures the selected Windows playback endpoint mix in its native shared-mode PCM format, including other apps routed through that endpoint. If deviceId is omitted, the default output endpoint is used.
        Protected or unavailable audio is not bypassed.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LibraryAudioCaptureStartInput"
      responses:
        "201":
          description: Recording started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LibraryAudioCaptureStartResponse"
        "403":
          description: User did not confirm recording authorization
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "503":
          description: Windows capture host or playback endpoint is unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /library/audio-capture/recoveries:
    get:
      operationId: getLibraryAudioCaptureRecoveries
      tags: [waveyard]
      summary: List recordings preserved after interruption
      responses:
        "200":
          description: Recoverable recordings belonging to the current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LibraryAudioCaptureRecoveriesResponse"
  /library/audio-capture/recoveries/{id}/import:
    post:
      operationId: importLibraryAudioCaptureRecovery
      tags: [waveyard]
      summary: Add a preserved recording to the Waveyard library
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Recording added or matched in the library
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LibraryAudioCaptureRecoveryImportResponse"
        "404":
          description: Recoverable recording not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /library/audio-capture/{id}:
    post:
      operationId: markLibraryAudioCaptureTrack
      tags: [waveyard]
      summary: Confirm the next track at the current captured PCM frame
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LibraryAudioCaptureTags"
      responses:
        "200":
          description: Boundary saved without restarting capture
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LibraryAudioCaptureStatusResponse"
        "409":
          description: Boundary or metadata cannot be recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    get:
      operationId: getLibraryAudioCaptureStatus
      tags: [waveyard]
      summary: Get the status of an active capture session
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Current recording state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LibraryAudioCaptureStatusResponse"
        "404":
          description: Capture session not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /library/audio-capture/{id}/stop:
    post:
      operationId: stopLibraryAudioCapture
      tags: [waveyard]
      summary: Stop, verify, and add a recording to the Waveyard library
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Recording added or matched in the library
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LibraryAudioCaptureStopResponse"
        "404":
          description: Capture session not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: Recording could not be safely finalized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "415":
          description: Unsupported or unverified source audio
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /library/audio-backup:
    get:
      operationId: getLibraryAudioBackup
      tags: [waveyard]
      summary: Download exact stored library originals as a ZIP with a CSV manifest
      description: Returns a ZIP archive when preflight is omitted. With preflight=1, returns the selected file count and total bytes. This does not retrieve Apple Music subscription audio.
      parameters:
        - name: ids
          in: query
          required: true
          style: form
          explode: false
          description: Comma-separated UUIDs of tracks whose exact original audio is already stored in Waveyard.
          schema:
            type: array
            minItems: 1
            maxItems: 100
            items:
              type: string
              format: uuid
        - name: preflight
          in: query
          required: false
          description: Set to 1 to return a size/count summary instead of the ZIP.
          schema:
            type: string
            enum: ["1"]
      responses:
        "200":
          description: ZIP download, or JSON preflight summary when preflight=1
          content:
            application/zip:
              schema:
                type: string
                format: binary
            application/json:
              schema:
                $ref: "#/components/schemas/LibraryAudioBackupPreflightResponse"
        "400":
          description: Invalid selection
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Selected original audio is unavailable or not owned by the current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: Stored original no longer matches its recorded metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "413":
          description: Selection exceeds the ZIP size limit
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "415":
          description: Unsupported source filename extension
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /library/tracks/{id}/separation:
    post:
      operationId: startLibraryTrackSeparation
      tags: [waveyard]
      summary: Start separation for a library track
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Separation is already running or available
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LibraryTrackSeparationStartResponse"
        "202":
          description: Separation job accepted by a worker
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LibraryTrackSeparationStartResponse"
        "400":
          description: Invalid track identifier
        "404":
          description: Track not found
        "409":
          description: A previous separation attempt already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LibraryTrackSeparationStartResponse"
        "503":
          description: No worker accepted the job
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LibraryTrackSeparationStartResponse"
  /jobs/{id}/cancel:
    post:
      operationId: cancelSeparationJob
      tags: [waveyard]
      summary: Stop an active local separation job
      description: A running job is terminal only after its isolated native worker exits. A 202 response remains active until then.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Separation stopped or was already stopped
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SeparationCancellationResponse"
        "202":
          description: Cancellation was requested; the local worker is still stopping
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SeparationCancellationResponse"
        "401":
          description: Authentication required
        "403":
          description: Editor access required
        "404":
          description: Separation job not found
        "409":
          description: Job is not active or its worker cannot be safely stopped
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "503":
          description: This runtime cannot control the active worker
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
components:
  schemas:
    ListeningSessionOrderInput:
      type: object
      required: [sessionTrackId, position]
      properties:
        sessionTrackId: { type: string, format: uuid }
        position: { type: integer, minimum: 0 }
        sessionOnly: { type: boolean }
        expectedOrder:
          description: Full ordered session-entry identifiers observed by the caller; compared under the ordering lock
          type: array
          items: { type: string, format: uuid }
    SavedQueueOrderInput:
      type: object
      required: [position]
      properties:
        position: { type: integer, minimum: 0 }
        sessionId: { type: string, format: uuid }
        expectedOrder:
          description: Full ordered saved-queue row identifiers observed by the caller; compared under the ordering lock
          type: array
          items: { type: string, format: uuid }
    ArcadeDevelopmentInput:
      type: object
      required: [authorized, op]
      properties:
        authorized: { type: boolean }
        op: { type: string, enum: [start, resume, approve, deny, check, event] }
        developmentId: { type: string }
        event:
          type: object
          required: [type, draftHash, profileId]
          properties:
            type: { type: string, enum: [installed, launched, stopped, rolled-back, owner-assessed-working, owner-assessed-failed] }
            draftHash: { type: string, pattern: "^[a-f0-9]{64}$" }
            profileId: { type: string, maxLength: 100 }
        snapshot:
          type: object
          required: [developmentId, gameId, title, original, draft, provenance]
          properties:
            developmentId: { type: string, maxLength: 100 }
            gameId: { type: string, maxLength: 200 }
            title: { type: string, maxLength: 200 }
            original: { type: string, maxLength: 50000 }
            draft: { type: string, maxLength: 50000 }
            provenance: { type: string, maxLength: 1000 }
        spaceId: { type: string }
        modelId: { type: string }
        prompt: { type: string, maxLength: 1000 }
        approvalId: { type: string }
    ArcadeModRepositoryInput:
      type: object
      required: [url, authorized]
      properties:
        url: { type: string, maxLength: 1000 }
        authorized: { type: boolean }
    ArcadeCatalogSearchInput:
      type: object
      required: [query, catalog, offset]
      properties:
        query: { type: string, maxLength: 80 }
        catalog: { type: string, enum: [all, bobeff, trilarion] }
        offset: { type: integer, minimum: 0, maximum: 10000 }
    ArcadeCatalogResolveInput:
      type: object
      required: [id]
      properties:
        id: { type: string, maxLength: 100 }
    ArcadeCatalogEntry:
      type: object
      required: [id, title, summary, category, sourceUrl, detailsUrl, catalogs, platforms, codeLicense, assetLicense]
      properties:
        id: { type: string }
        title: { type: string }
        summary: { type: string }
        category: { type: string }
        sourceUrl: { type: [string, "null"] }
        detailsUrl: { type: string }
        catalogs: { type: array, items: { type: string } }
        platforms: { type: array, items: { type: string } }
        codeLicense: { type: [string, "null"] }
        assetLicense: { type: [string, "null"] }
    ArcadeRepositoryReleaseInput:
      type: object
      properties:
        token: { type: string, maxLength: 100 }
        releaseIndex: { type: integer, minimum: 0, maximum: 3 }
        assetIndex: { type: integer, minimum: 0, maximum: 23 }
        authorized: { type: boolean }
      required: [token, releaseIndex, assetIndex, authorized]
    ArcadeRepositoryReleasePlan:
      type: object
      properties:
        provenance: { $ref: "#/components/schemas/ArcadeRepositoryProvenance" }
        tag: { type: string }
        prerelease: { type: boolean }
        asset: { $ref: "#/components/schemas/ArcadeRepositoryReleaseAsset" }
      required: [provenance, tag, prerelease, asset]
    ArcadeRepositoryEvidence:
      type: object
      properties:
        path: { type: string }
        detail: { type: string }
      required: [path, detail]
    ArcadeRepositoryReleaseAsset:
      type: object
      properties:
        name: { type: string }
        url: { type: string }
        bytes: { type: integer }
        sha256: { type: [string, "null"] }
      required: [name, url, bytes, sha256]
    ArcadeRepositoryRelease:
      type: object
      properties:
        name: { type: string }
        tag: { type: string }
        reviewUrl: { type: string }
        prerelease: { type: boolean }
        assets:
          type: array
          items: { $ref: "#/components/schemas/ArcadeRepositoryReleaseAsset" }
      required: [name, tag, reviewUrl, prerelease, assets]
    ArcadeRepositoryAssessment:
      type: object
      properties:
        token: { type: string }
        expiresAt: { type: integer }
        provider: { type: string }
        repository: { type: string }
        revision: { type: string }
        sourceUrl: { type: string }
        folder: { type: string }
        reference: { type: string }
        projectType: { type: string, enum: [browser, godot, sdl, native, unknown] }
        confidence: { type: string, enum: [high, medium, low] }
        languages: { type: array, items: { type: string } }
        buildSystems: { type: array, items: { type: string } }
        dependencies: { type: array, items: { type: string } }
        sdks: { type: array, items: { type: string } }
        targets: { type: array, items: { type: string } }
