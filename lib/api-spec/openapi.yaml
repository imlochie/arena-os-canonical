openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: waveyard
    description: Waveyard library operations
paths:
  /library/tracks:
    get:
      operationId: getLibraryTracks
      tags: [waveyard]
      summary: List library tracks with available stem types
      parameters:
        - name: q
          in: query
          required: false
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 500
      responses:
        "200":
          description: Library tracks
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LibraryTrackListResponse"
  /library/conversions:
    get:
      operationId: getLibraryConversionOptions
      tags: [waveyard]
      summary: List formats supported for local audio conversion
      responses:
        "200":
          description: Local conversion options and source restrictions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LibraryConversionOptionsResponse"
    post:
      operationId: createLibraryConversion
      tags: [waveyard]
      summary: Convert an owner-uploaded local audio track
      description: Converts only a device-uploaded local file after an explicit rights review. Protected subscription audio is not accessed.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LibraryConversionInput"
      responses:
        "200":
          description: Existing matching converted track returned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LibraryConversionResponse"
        "201":
          description: Converted and verified copy added to the library
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LibraryConversionResponse"
        "403":
          description: Source is not a device-uploaded local audio file
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Track not found for the current owner
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: Source checksum did not match its stored identity
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /library/audio-capture:
    get:
      operationId: getLibraryAudioCaptureOptions
      tags: [waveyard]
      summary: Check Windows audio loopback capture availability
      responses:
        "200":
          description: Capture-host status and active Windows playback endpoints
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LibraryAudioCaptureOptionsResponse"
    post:
      operationId: startLibraryAudioCapture
      tags: [waveyard]
      summary: Start an authorized Windows system-loopback recording
      description: Records the selected Windows playback endpoint mix in its native shared-mode PCM format. Protected or unavailable audio is not bypassed.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LibraryAudioCaptureStartInput"
      responses:
        "201":
          description: Recording started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LibraryAudioCaptureStartResponse"
        "403":
          description: User did not confirm recording authorization
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "503":
          description: Windows capture host or playback endpoint is unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /library/audio-capture/recoveries:
    get:
      operationId: getLibraryAudioCaptureRecoveries
      tags: [waveyard]
      summary: List recordings preserved after interruption
      responses:
        "200":
          description: Recoverable recordings belonging to the current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LibraryAudioCaptureRecoveriesResponse"
  /library/audio-capture/recoveries/{id}/import:
    post:
      operationId: importLibraryAudioCaptureRecovery
      tags: [waveyard]
      summary: Add a preserved recording to the Waveyard library
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Recording added or matched in the library
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LibraryAudioCaptureRecoveryImportResponse"
        "404":
          description: Recoverable recording not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /library/audio-capture/{id}:
    get:
      operationId: getLibraryAudioCaptureStatus
      tags: [waveyard]
      summary: Get the status of an active capture session
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Current recording state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LibraryAudioCaptureStatusResponse"
        "404":
          description: Capture session not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /library/audio-capture/{id}/stop:
    post:
      operationId: stopLibraryAudioCapture
      tags: [waveyard]
      summary: Stop, verify, and add a recording to the Waveyard library
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Recording added or matched in the library
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LibraryAudioCaptureStopResponse"
        "404":
          description: Capture session not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: Recording could not be safely finalized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "415":
          description: Unsupported or unverified source audio
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /library/audio-backup:
    get:
      operationId: getLibraryAudioBackup
      tags: [waveyard]
      summary: Download exact stored library originals as a ZIP with a CSV manifest
      description: Returns a ZIP archive when preflight is omitted. With preflight=1, returns the selected file count and total bytes. This does not retrieve Apple Music subscription audio.
      parameters:
        - name: ids
          in: query
          required: true
          style: form
          explode: false
          description: Comma-separated UUIDs of tracks whose exact original audio is already stored in Waveyard.
          schema:
            type: array
            minItems: 1
            maxItems: 100
            items:
              type: string
              format: uuid
        - name: preflight
          in: query
          required: false
          description: Set to 1 to return a size/count summary instead of the ZIP.
          schema:
            type: string
            enum: ["1"]
      responses:
        "200":
          description: ZIP download, or JSON preflight summary when preflight=1
          content:
            application/zip:
              schema:
                type: string
                format: binary
            application/json:
              schema:
                $ref: "#/components/schemas/LibraryAudioBackupPreflightResponse"
        "400":
          description: Invalid selection
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Selected original audio is unavailable or not owned by the current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: Stored original no longer matches its recorded metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "413":
          description: Selection exceeds the ZIP size limit
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "415":
          description: Unsupported source filename extension
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /library/tracks/{id}/separation:
    post:
      operationId: startLibraryTrackSeparation
      tags: [waveyard]
      summary: Start separation for a library track
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Separation is already running or available
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LibraryTrackSeparationStartResponse"
        "202":
          description: Separation job accepted by a worker
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LibraryTrackSeparationStartResponse"
        "400":
          description: Invalid track identifier
        "404":
          description: Track not found
        "409":
          description: A previous separation attempt already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LibraryTrackSeparationStartResponse"
        "503":
          description: No worker accepted the job
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LibraryTrackSeparationStartResponse"
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    LibraryTrackListResponse:
      type: object
      properties:
        tracks:
          type: array
          items:
            $ref: "#/components/schemas/LibraryTrackSummary"
      required: [tracks]
    LibraryAudioBackupPreflightResponse:
      type: object
      properties:
        audioFiles:
          type: integer
          minimum: 1
          maximum: 100
        totalBytes:
          type: integer
          minimum: 1
          maximum: 2147483648
        maximumFiles:
          type: integer
          example: 100
        maximumBytes:
          type: integer
          example: 2147483648
      required: [audioFiles, totalBytes, maximumFiles, maximumBytes]
    LibraryConversionFormat:
      type: object
      properties:
        id:
          type: string
          enum: [mp3, aac, wav, flac, alac]
        extension:
          type: string
        mimeType:
          type: string
        lossy:
          type: boolean
        available:
          type: boolean
      required: [id, extension, mimeType, lossy, available]
    LibraryConversionOptionsResponse:
      type: object
      properties:
        formats:
          type: array
          items:
            $ref: "#/components/schemas/LibraryConversionFormat"
        sourcePolicy:
          type: string
        error:
          type: string
      required: [formats]
    LibraryConversionInput:
      type: object
      properties:
        trackId:
          type: string
          format: uuid
        format:
          type: string
          enum: [mp3, aac, wav, flac, alac]
        bitrate:
          type: integer
          enum: [128, 192, 256, 320]
          default: 192
        rightsReviewed:
          type: boolean
          enum: [true]
      required: [trackId, format, rightsReviewed]
      additionalProperties: false
    LibraryConversionVerification:
      type: object
      properties:
        checksumSha256:
          type: string
        fileSizeBytes:
          type: integer
        durationSeconds:
          type: number
        codec:
          type: string
        sampleRate:
          type: integer
        channels:
          type: integer
        warnings:
          type: array
          items:
            type: string
      required: [checksumSha256, fileSizeBytes, durationSeconds, codec, sampleRate, channels, warnings]
    LibraryConversionResponse:
      type: object
      properties:
        track:
          $ref: "#/components/schemas/LibraryTrackSummary"
        created:
          type: boolean
        originalTrackId:
          type: string
          format: uuid
        format:
          type: string
          enum: [mp3, aac, wav, flac, alac]
        verification:
          $ref: "#/components/schemas/LibraryConversionVerification"
        notice:
          type: string
      required: [track, created, originalTrackId, format, verification, notice]
    LibraryAudioCaptureDevice:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        isDefault:
          type: boolean
      required: [id, name, isDefault]
    LibraryAudioCaptureOptionsResponse:
      type: object
      properties:
        available:
          type: boolean
        devices:
          type: array
          items:
            $ref: "#/components/schemas/LibraryAudioCaptureDevice"
        reason:
          type: string
        storage:
          $ref: "#/components/schemas/LibraryAudioCaptureStorageBudget"
        activeSession:
          $ref: "#/components/schemas/LibraryAudioCaptureStatusResponse"
        recoveryError:
          type: string
      required: [available, devices]
    LibraryAudioCaptureStorageBudget:
      type: object
      properties:
        availableBytes:
          type: integer
          minimum: 0
        reserveBytes:
          type: integer
          minimum: 0
        canRecord:
          type: boolean
        reason:
          type: string
      required: [availableBytes, reserveBytes, canRecord]
    LibraryAudioCaptureRecovery:
      type: object
      properties:
        sessionId:
          type: string
          format: uuid
        title:
          type: string
        artist:
          type: string
        album:
          type: string
        createdAt:
          type: string
          format: date-time
        signal:
          $ref: "#/components/schemas/LibraryAudioCaptureSignal"
      required: [sessionId, title, createdAt]
    LibraryAudioCaptureRecoveriesResponse:
      type: object
      properties:
        recoveries:
          type: array
          items:
            $ref: "#/components/schemas/LibraryAudioCaptureRecovery"
      required: [recoveries]
    LibraryAudioCaptureRecoveryImportResponse:
      type: object
      properties:
        track:
          $ref: "#/components/schemas/LibraryTrackSummary"
        created:
          type: boolean
        separationQueued:
          type: boolean
        signal:
          $ref: "#/components/schemas/LibraryAudioCaptureSignal"
      required: [track, created, separationQueued]
    LibraryAudioCaptureFormat:
      type: object
      properties:
        sampleRate:
          type: integer
          minimum: 1
        channels:
          type: integer
          minimum: 1
        bitsPerSample:
          type: integer
          minimum: 1
        blockAlign:
          type: integer
          minimum: 1
      required: [sampleRate, channels, bitsPerSample, blockAlign]
    LibraryAudioCaptureStartInput:
      type: object
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
        artist:
          type: string
          maxLength: 200
        album:
          type: string
          maxLength: 200
        deviceId:
          type: string
          maxLength: 4096
        rightsReviewed:
          type: boolean
          enum: [true]
      required: [title, rightsReviewed]
      additionalProperties: false
    LibraryAudioCaptureStartResponse:
      type: object
      properties:
        sessionId:
          type: string
          format: uuid
        status:
          type: string
          enum: [recording]
        startedAt:
          type: string
          format: date-time
        format:
          $ref: "#/components/schemas/LibraryAudioCaptureFormat"
      required: [sessionId, status, startedAt, format]
    LibraryAudioCaptureSignal:
      type: object
      required: [state, peak, capturedSeconds, signalSeen, clippedSamples, invalidSamples]
      properties:
        state:
          type: string
          enum: [waiting, silent, active, unsupported]
        peak:
          type: number
          minimum: 0
          maximum: 1
        capturedSeconds:
          type: number
          minimum: 0
        signalSeen:
          type: boolean
        clippedSamples:
          type: integer
          minimum: 0
        invalidSamples:
          type: integer
          minimum: 0
    LibraryAudioCaptureStatusResponse:
      type: object
      properties:
        sessionId:
          type: string
          format: uuid
        status:
          type: string
          enum: [starting, recording, stopping, completed, failed]
        title:
          type: string
        startedAt:
          type: string
          format: date-time
        elapsedSeconds:
          type: number
          minimum: 0
        discontinuityCount:
          type: integer
          minimum: 0
        availableBytes:
          type: integer
          minimum: 0
        reserveBytes:
          type: integer
          minimum: 0
        estimatedSecondsRemaining:
          type: integer
          minimum: 0
        format:
          $ref: "#/components/schemas/LibraryAudioCaptureFormat"
        message:
          type: string
        signal:
          $ref: "#/components/schemas/LibraryAudioCaptureSignal"
      required: [sessionId, status, title, elapsedSeconds, discontinuityCount]
    LibraryAudioCaptureStopResponse:
      type: object
      properties:
        track:
          $ref: "#/components/schemas/LibraryTrackSummary"
        created:
          type: boolean
        separationQueued:
          type: boolean
        sampleFrames:
          type: integer
          minimum: 0
        durationSeconds:
          type: number
          minimum: 0
        format:
          $ref: "#/components/schemas/LibraryAudioCaptureFormat"
        discontinuityCount:
          type: integer
          minimum: 0
        signal:
          $ref: "#/components/schemas/LibraryAudioCaptureSignal"
      required: [track, created, separationQueued, sampleFrames, durationSeconds, format, discontinuityCount]
    ApiError:
      type: object
      properties:
        error:
          type: string
      required: [error]
    LibraryTrackSummary:
      type: object
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        artist:
          type: string
        album:
          type: string
        durationSeconds:
          type: number
        playCount:
          type: integer
        rating:
          type: integer
          minimum: 0
          maximum: 5
        labels:
          type: array
          items:
            type: string
        lastPlayedAt:
          type: ["string", "null"]
          format: date-time
        addedAt:
          type: string
          format: date-time
        stemAvailability:
          $ref: "#/components/schemas/StemAvailability"
        analysis:
          $ref: "#/components/schemas/TrackAnalysis"
        studioProjectId:
          type: string
          format: uuid
      required: [id, title, artist, album, durationSeconds, playCount, rating, labels, lastPlayedAt, addedAt, stemAvailability, studioProjectId]
    TrackAnalysis:
      type: ["object", "null"]
      properties:
        status:
          type: string
        bpm:
          type: ["number", "null"]
        musicalKey:
          type: ["string", "null"]
      required: [status, bpm, musicalKey]
    StemAvailability:
      oneOf:
        - type: object
          properties:
            status:
              type: string
              enum: [separated]
            stemCount:
              type: integer
            stemTypes:
              type: array
              items:
                type: string
          required: [status, stemCount, stemTypes]
        - type: object
          properties:
            status:
              type: string
              enum: [source-only, not-started, unavailable]
            reason:
              type: string
          required: [status, reason]
        - type: object
          properties:
            status:
              type: string
              enum: [processing]
            reason:
              type: string
            stage:
              type: string
            progress:
              $ref: "#/components/schemas/StemSeparationProgress"
          required: [status, reason]
        - type: object
          properties:
            status:
              type: string
              enum: [rejected, failed]
            reason:
              type: string
            retryJobId:
              type: string
              format: uuid
          required: [status, reason, retryJobId]
    StemSeparationProgress:
      type: object
      properties:
        percent:
          type: integer
          minimum: 0
          maximum: 100
        phase:
          type: string
      required: [percent]
    LibraryTrackSeparationStartResponse:
      type: object
      properties:
        state:
          type: string
          enum: [queued, processing, separated, previous-attempt, failed]
        jobId:
          type: [string, "null"]
          format: uuid
        stemCount:
          type: [integer, "null"]
        error:
          type: [string, "null"]
      required: [state, jobId, stemCount, error]

