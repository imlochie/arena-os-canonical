services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: arena
      POSTGRES_USER: arena
      POSTGRES_PASSWORD: arena-local-development-only
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U arena -d arena"]
      interval: 5s
      timeout: 5s
      retries: 30

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes: [redis_data:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 30

  minio:
    image: minio/minio:latest
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: arena
      MINIO_ROOT_PASSWORD: arena-local-development-only
    ports: ["9000:9000", "9001:9001"]
    volumes: [minio_data:/data]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 30

  minio-setup:
    image: minio/mc:latest
    depends_on:
      minio: { condition: service_healthy }
    entrypoint: ["/bin/sh", "-c"]
    command: ["mc alias set local http://minio:9000 arena arena-local-development-only && mc mb --ignore-existing local/arena-stems && mc anonymous set none local/arena-stems"]

  migrate:
    build: { context: ., dockerfile: docker/web.Dockerfile, target: migrator }
    environment: &arena_stem_environment
      DATABASE_URL: postgresql://arena:arena-local-development-only@postgres:5432/arena
      REDIS_URL: redis://redis:6379
      STEM_PIPELINE_ENABLED: "true"
      STEM_STORAGE_PROVIDER: s3
      STEM_S3_ENDPOINT: http://minio:9000
      STEM_S3_REGION: us-east-1
      STEM_S3_BUCKET: arena-stems
      STEM_S3_ACCESS_KEY: arena
      STEM_S3_SECRET_KEY: arena-local-development-only
      STEM_S3_FORCE_PATH_STYLE: "true"
      STEM_MODEL: htdemucs
      STEM_DEVICE: cpu
      STEM_WORKER_CONCURRENCY: "1"
    depends_on:
      postgres: { condition: service_healthy }

  web:
    build: { context: ., dockerfile: docker/web.Dockerfile }
    ports: ["3000:3000"]
    environment: *arena_stem_environment
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
      minio-setup: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:3000/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s

  worker:
    build: { context: ., dockerfile: docker/worker.Dockerfile }
    environment: *arena_stem_environment
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
      minio-setup: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD-SHELL", "npm run worker:doctor"]
      interval: 30s
      timeout: 30s
      retries: 20
      start_period: 45s

  e2e:
    profiles: ["test"]
    build: { context: ., dockerfile: docker/e2e.Dockerfile }
    environment:
      ARENA_E2E_URL: http://web:3000
    depends_on:
      web: { condition: service_healthy }
      worker: { condition: service_healthy }

volumes:
  postgres_data:
  redis_data:
  minio_data:
