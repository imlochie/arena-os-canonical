services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: waveyard
      POSTGRES_USER: waveyard
      POSTGRES_PASSWORD: waveyard
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U waveyard -d waveyard"]
      interval: 5s
      timeout: 5s
      retries: 20
  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes: [redis_data:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
  minio:
    image: minio/minio:latest
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: waveyard
      MINIO_ROOT_PASSWORD: waveyard-local-development-only
    ports: ["9000:9000", "9001:9001"]
    volumes: [minio_data:/data]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 20
  minio-setup:
    image: minio/mc:latest
    depends_on:
      minio: { condition: service_healthy }
    entrypoint: ["/bin/sh", "-c"]
    command: ["mc alias set local http://minio:9000 waveyard waveyard-local-development-only && mc mb --ignore-existing local/waveyard"]
  migrate:
    build: { context: ., dockerfile: docker/web.Dockerfile }
    command: npm run db:migrate
    environment: &waveyard_env
      DATABASE_URL: postgresql://waveyard:waveyard@postgres:5432/waveyard
      REDIS_URL: redis://redis:6379
      SESSION_SECRET: replace-me-for-production-with-at-least-32-random-characters
      STORAGE_PROVIDER: s3
      S3_ENDPOINT: http://minio:9000
      S3_REGION: us-east-1
      S3_BUCKET: waveyard
      S3_ACCESS_KEY: waveyard
      S3_SECRET_KEY: waveyard-local-development-only
      S3_FORCE_PATH_STYLE: "true"
      SEPARATION_ENGINE: demucs
      SEPARATION_MODEL: htdemucs
      STEM_DEVICE: cpu
      WORKER_CONCURRENCY: "1"
    depends_on:
      postgres: { condition: service_healthy }
  web:
    build: { context: ., dockerfile: docker/web.Dockerfile }
    ports: ["3000:3000"]
    environment: *waveyard_env
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
      minio-setup: { condition: service_completed_successfully }
  worker:
    build: { context: ., dockerfile: docker/worker.Dockerfile }
    environment: *waveyard_env
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
      minio-setup: { condition: service_completed_successfully }
volumes:
  postgres_data:
  redis_data:
  minio_data:
